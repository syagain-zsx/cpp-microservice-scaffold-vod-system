# ============================================================
# 笺流（JianLiu）服务编排
#
# 前置：
#   1. 外部网络 dev-environment_dev-network 已存在（中间件所在网络）；
#   2. 已执行 ./scripts/build.sh && ./scripts/package.sh；
#   3. 在仓库根目录执行：
#        docker compose -f deploy/docker-compose.yml up -d --build
# ============================================================
version: '3.8'

networks:
  dev-network:
    external: true
    name: dev-environment_dev-network

services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: gateway_service
    volumes:
      - ./conf/global.conf:/conf/global.conf:ro
    environment:
      - CONF_FILE=/conf/global.conf
      - EXEC_FILE=/bin/gateway_server
      - LISTEN_PORT=10000
      - USER_SVC_NAME=user
      - FILE_SVC_NAME=file
      - VIDEO_SVC_NAME=video
    ports:
      - "10000:10000"
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://127.0.0.1:10000/status || exit 1" ]
      start_period: 10s
      retries: 10
      interval: 5s
    networks:
      - dev-network

  file:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: file_service
    volumes:
      - ./conf/global.conf:/conf/global.conf:ro
    environment:
      - CONF_FILE=/conf/global.conf
      - EXEC_FILE=/bin/file_server
      - LISTEN_PORT=10001
      - REGISTRY_NAME=file
      - REGISTRY_ADDR=file:10001
    ports:
      - "10001:10001"
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://127.0.0.1:10001/status || exit 1" ]
      start_period: 10s
      retries: 10
      interval: 5s
    networks:
      - dev-network

  user:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: user_service
    volumes:
      - ./conf/global.conf:/conf/global.conf:ro
    environment:
      - CONF_FILE=/conf/global.conf
      - EXEC_FILE=/bin/user_server
      - LISTEN_PORT=10002
      - REGISTRY_NAME=user
      - REGISTRY_ADDR=user:10002
    ports:
      - "10002:10002"
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://127.0.0.1:10002/status || exit 1" ]
      start_period: 10s
      retries: 10
      interval: 5s
    networks:
      - dev-network

  video:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: video_service
    volumes:
      - ./conf/global.conf:/conf/global.conf:ro
    environment:
      - CONF_FILE=/conf/global.conf
      - EXEC_FILE=/bin/video_server
      - LISTEN_PORT=10003
      - REGISTRY_NAME=video
      - REGISTRY_ADDR=video:10003
    ports:
      - "10003:10003"
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://127.0.0.1:10003/status || exit 1" ]
      start_period: 10s
      retries: 10
      interval: 5s
    networks:
      - dev-network

  transcode:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: transcode_service
    volumes:
      - ./conf/global.conf:/conf/global.conf:ro
      - ./data/transcode:/app/temp_path
    environment:
      - CONF_FILE=/conf/global.conf
      - EXEC_FILE=/bin/transcode_server
      - REGISTRY_NAME=transcode
      - REGISTRY_ADDR=transcode:10004
    restart: always
    networks:
      - dev-network
